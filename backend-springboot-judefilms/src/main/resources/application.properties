spring.application.name=backend-springboot-judefilms
spring.config.import=optional:file:.env[.properties]

# ============ Base de Datos ============
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_backend_judefilms?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ============ Seguridad / Admin ============
config.security.admin.username=${ADMIN_USER:jude}
config.security.admin.password=${ADMIN_PASSWORD:}
config.security.admin.role=${ADMIN_ROLE:ADMIN}

# ============ Cloudflare R2 ============
cloudflare.r2.access-key=${R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${R2_SECRET_KEY:}
cloudflare.r2.endpoint=${R2_ENDPOINT:}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:judefilms-contratos}
cloudflare.r2.public-url=${R2_PUBLIC_URL:}

# ============ CORS ============
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}


# ============ Upload ============
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB